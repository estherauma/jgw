{% extends 'demo_dashboard/base/base.html' %}

{% block content %}
<div>
    <div class="content-page" style="margin-top: 100px;">
        <div class="content">
            <!-- Start Content-->
            <div class="container-fluid">
                <div class="row">
                    <div class="col-md-6 col-xl-3">
                        <div class="card">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-12 text-center">
                                        <h5>Downloads</h5>
                                    </div>
                                    <div class="col-12">
                                        <div class="text-center">
                                            <h3 class="text-dark my-1"><span data-plugin="counterup">12,145</span></h3>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div> <!-- end card-->
                    </div> <!-- end col -->
                    <div class="col-md-6 col-xl-3">
                        <div class="card">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-12 text-center">
                                        <h5>Views</h5>
                                    </div>
                                    <div class="col-12">
                                        <div class="text-center">
                                            <h3 class="text-dark my-1"><span data-plugin="counterup">456,145</span></h3>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div> <!-- end card-->
                    </div> <!-- end col -->
                    <div class="col-md-6 col-xl-3">
                        <div class="card">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-12 text-center">
                                        <h5>Question Responses</h5>
                                    </div>
                                    <div class="col-12">
                                        <div class="text-center">
                                            <h3 class="text-dark my-1"><span data-plugin="counterup">18,145</span></h3>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div> <!-- end card-->
                    </div> <!-- end col -->
                    <div class="col-md-6 col-xl-3">
                        <div class="card">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-12 text-center">
                                        <h5>Anonymous stories</h5>
                                    </div>
                                    <div class="col-12">
                                        <div class="text-center">
                                            <h3 class="text-dark my-1"><span data-plugin="counterup">18,145</span></h3>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div> <!-- end card-->
                    </div> <!-- end col -->
                </div>
                <!-- end row -->

                <div class="row">
                    <div class="col-xl-6">
                        <div class="card">
                            <div class="card-body">
                                <div class="card-widgets">
                                    <a href="javascript: void(0);" data-toggle="reload"><i class="mdi mdi-refresh"></i></a>
                                    <a data-bs-toggle="collapse" href="#uandrusers" role="button" aria-expanded="false" aria-controls="cardCollpase4"><i class="mdi mdi-minus"></i></a>
                                </div>
                                <h4 class="header-title mb-0">Unique and returning users</h4>

                                <div id="uandrusers" class="collapse show">
                                    <div class="pt-3">
                                        <div style="height: 433px">
                                            <canvas id="unique-and-returning-users" width="100%" height="100%">
                                        </div>
                                    </div>
                                </div> <!-- collapsed end -->
                            </div> <!-- end card-body -->
                        </div> <!-- end card-->
                    </div> <!-- end col -->
                    <div class="col-xl-6">
                        <div class="card">
                            <div class="card-body">
                                <div class="card-widgets">
                                    <a href="javascript: void(0);" data-toggle="reload"><i class="mdi mdi-refresh"></i></a>
                                    <a data-bs-toggle="collapse" href="#cardCollpase4" role="button" aria-expanded="false" aria-controls="cardCollpase4"><i class="mdi mdi-minus"></i></a>
                                </div>
                                <h4 class="header-title mb-0">Countries</h4>

                                <div id="cardCollpase4" class="collapse show">
                                    <div class="pt-3">
                                        <div id="world-map-markers" style="height: 433px"></div>
                                    </div>
                                </div> <!-- collapsed end -->
                            </div> <!-- end card-body -->
                        </div> <!-- end card-->
                    </div> <!-- end col -->
                </div>
                <!-- end row -->

            </div> <!-- container -->

        </div> <!-- content -->

    </div>
</div>
{% endblock content %}

{% block scripts %}
<script  type="text/javascript">

    var uniqueAndReturningUsersChartCtx = document.getElementById('unique-and-returning-users').getContext('2d');
    var uniqueAndReturningUsersChart = new Chart(uniqueAndReturningUsersChartCtx, {
        type: 'bar',
        data: {
            labels: [{% for label in routes %} '{{ label | safe }}', {% endfor %}],
            datasets: [
            {
                label:'Returning users',
                data: [{% for returning_data in returning_data_list %} '{{ returning_data }}', {% endfor %}],
                backgroundColor:['rgba(17, 202, 108, 1)'],
                borderWidth: 0
            },
            {
                label:'Unique users',
                data: [{% for unique_data in unique_data_list %} '{{ unique_data }}', {% endfor %}],
                backgroundColor:['rgba(68, 191, 229, 1)'],
                borderWidth: 0
            }
            ]
        },
        options: {
            scales: {
                y: {
                    grid: {
                        display: false,
                        drawOnChartArea: false,
                        drawBorder: false,
                    },
                    ticks: {
                        display: false
                    }
                },
                x: {
                    grid: {
                        display: false,
                        drawOnChartArea: false,
                        drawBorder: false,
                    },
                    ticks: {
                        display: false
                    }
                },
            },
            borderWidth: 0
        }
    })
</script>
{% endblock scripts %}
