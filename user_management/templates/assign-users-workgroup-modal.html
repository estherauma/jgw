<div class="modal fade" id="assign-users-workgroup-modal" tabindex="-1" role="dialog" aria-labelledby="assign-users-workgroup-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="um-modal-title um-navy" id="assign-users-workgroup-title">Add users to department</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="um-modal-divider"></div>
            <form id="assign-users-workgroup-form" method="post" action="{{ form_action }}">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="alert alert-danger d-none" id="assign-users-workgroup-form-error" role="alert"></div>
                    <input type="hidden" name="selected_org_id" data-selected-org-id />
                    <input type="hidden" name="user_ids" data-selected-user-ids />
                    {% if not is_org_admin %}
                    <div class="um-navy mb-2">
                        Organisation: <span class="fw-bold">{{ selected_org_name|default:"None" }}</span>
                    </div>
                    {% endif %}
                    <div class="um-navy mb-2">
                        Selected users: <span class="fw-bold" data-selected-users-count>0</span>
                    </div>
                    <div class="um-navy mb-2">
                        Departments
                    </div>
                    <div class="um-checkbox-list um-checkbox-list-scroll" data-workgroup-options>
                        {% if work_groups %}
                        <ul>
                            {% for group in work_groups %}
                            <li>
                                <label for="id_assign_users_workgroup_{{ forloop.counter0 }}">
                                    <input type="checkbox" class="form-check-input" name="work_groups" value="{{ group.id }}" id="id_assign_users_workgroup_{{ forloop.counter0 }}">
                                    {{ group.name }}
                                </label>
                            </li>
                            {% endfor %}
                        </ul>
                        {% else %}
                        <p class="mb-0">No departments available.</p>
                        {% endif %}
                    </div>
                </div>
                <div class="um-modal-footer modal-footer">
                    <button type="button" class="um-btn um-btn-gray" data-dismiss="modal">
                        Cancel
                    </button>
                    <button type="submit" class="um-btn um-btn-lime px-4">Add</button>
                </div>
            </form>
        </div>
    </div>
</div>
