{% load um_waffle_flags %}
<div class="modal fade" id="{{ action_type }}-role-modal" tabindex="-1" role="dialog" aria-labelledby="{{ action_type }}-role-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="um-modal-title um-navy" id="{{ action_type }}-role-title">{{ modal_title }}</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="alert alert-danger d-none" id="{{ action_type }}-role-form-error" role="alert"></div>
            <div class="um-modal-divider"></div>
            <form id="{{ action_type }}-role-form" method="post" action="{{ form_action }}">
                {% csrf_token %}
                <div class="modal-body um-modal-grid">
                    <input type="hidden" name="selected_org_id" data-selected-org-id value="" />
                    <label class="um-field form-group">
                        <span>Name</span>
                        {{ form.name }}
                        <div class="text-danger small" data-error-for="name"></div>
                        {% if form.name.errors %}
                            <div class="text-danger small">{{ form.name.errors }}</div>
                        {% endif %}
                    </label>
                    <label class="um-field form-group">
                        <span>Description</span>
                        {{ form.description }}
                        <div class="text-danger small" data-error-for="description"></div>
                        {% if form.description.errors %}
                            <div class="text-danger small">{{ form.description.errors }}</div>
                        {% endif %}
                    </label>
                    {% flag 'can_assign_role_permissions' %}
                    <label class="um-field form-group um-field-full">
                        <span>Permissions</span>
                        <div class="um-checkbox-list um-checkbox-list-scroll">
                            {{ form.permissions }}
                        </div>
                        <div class="text-danger small" data-error-for="permissions"></div>
                        {% if form.permissions.errors %}
                            <div class="text-danger small">{{ form.permissions.errors }}</div>
                        {% endif %}
                    </label>
                    {% endflag %}
                </div>
                <div class="um-modal-footer modal-footer">
                    <button type="button" class="um-btn um-btn-gray" data-dismiss="modal">Cancel</button>
                    <button type="submit" class="um-btn um-btn-lime px-4">{{ submit_label }}</button>
                </div>
            </form>
        </div>
    </div>
</div>
