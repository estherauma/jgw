{% load um_waffle_flags %}
{% if organizations %}
    {% for org in organizations %}
    <tr data-org-row>
        <td>{{ forloop.counter }}</td>
        <td>{{ org.name }}</td>
        <td>{{ org.org_code }}</td>
        <td>
            <div class="um-action">
                {% flag 'can_edit_organizations' %}
                <button class="um-btn um-btn-outline" data-edit-btn data-toggle="modal" data-target="#edit-org-modal" data-org-id="{{ org.id }}" data-org-details-url="{% url 'user_management:edit_organisation' org.id %}">
                    Edit
                </button>
                {% endflag %}
            </div>
        </td>
    </tr>
    {% endfor %}
{% else %}
    <tr data-org-row>
        <td colspan="4">No organisations found.</td>
    </tr>
{% endif %}
