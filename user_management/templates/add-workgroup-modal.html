{% load um_waffle_flags %}
<div class="modal fade" id="{{ action_type }}-workgroup-modal" tabindex="-1" role="dialog" aria-labelledby="{{ action_type }}-workgroup-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="um-modal-title um-navy" id="{{ action_type }}-workgroup-title">{{ modal_title }}</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="um-modal-divider"></div>
            <form id="{{ action_type }}-workgroup-form" method="post" action="{{ form_action }}" >
                {% csrf_token %}
                <div class="modal-body">
                    <div class="alert alert-danger d-none" id="{{ action_type }}-workgroup-form-error" role="alert"></div>
                    {% if form.non_field_errors %}
                        <div class="alert alert-danger" role="alert">
                            {{ form.non_field_errors }}
                        </div>
                    {% endif %}
                    <input type="hidden" name="selected_org_id" data-selected-org-id />
                    {% flag 'can_view_organizations_table' %}
                    <div class="um-navy mb-2">
                        Organisation: <span class="fw-bold" data-workgroup-org-label>None selected</span>
                    </div>
                    {% endflag %}
                    <label class="um-field form-group mt-1">
                        <span>Department name</span>
                        {{ form.name }}
                        <div class="text-danger small" data-error-for="name"></div>
                        {% if form.name.errors %}
                            <div class="text-danger small">{{ form.name.errors }}</div>
                        {% endif %}
                    </label>
                </div>
                <div class="um-modal-footer modal-footer">
                    <button type="button" class="um-btn um-btn-gray" data-dismiss="modal">
                        Cancel
                    </button>
                    <button type="submit" class="um-btn um-btn-lime px-4">{{ submit_label }}</button>
                </div>
            </form>
        </div>
    </div>
</div>
