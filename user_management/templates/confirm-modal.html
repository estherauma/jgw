<div class="modal fade" id="confirm-modal" tabindex="-1" role="dialog" aria-labelledby="delete-confirm-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="um-modal-title um-navy" id="confirm-title" data-title></h5>
                <button type="button" class="close" data-dismiss="modal" data-bs-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="um-modal-divider"></div>
            <div class="modal-body">
                <div class="alert alert-danger d-none" id="confirm-error" role="alert"></div>
                <p class="um-navy" data-message></p>
                <p class="um-navy" data-warning></p>
                
            </div>
            <div class="um-modal-footer modal-footer">
                <button type="button" class="um-btn um-btn-gray" data-dismiss="modal" data-bs-dismiss="modal">
                    Cancel
                </button>
                <button type="button" class="um-btn um-btn-danger" data-confirm-btn>
                </button>
            </div>
        </div>
    </div>
</div>
