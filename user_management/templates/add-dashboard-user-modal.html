{% load um_waffle_flags %}
<div class="modal fade um-modal um-modal-lg" id="{{ action_type }}-dashboard-user-modal" tabindex="-1" role="dialog" aria-labelledby="{{ action_type }}-dashboard-user-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="um-modal-title um-navy" id="{{ action_type }}-dashboard-user-title">{{ modal_title }}</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="alert alert-danger d-none" id="{{ action_type }}-dashboard-user-form-error" role="alert"></div>
            <div class="um-modal-divider"></div>
            <form id="{{ action_type }}-dashboard-user-form" method="post" action="{{ form_action }}" novalidate>
                {% csrf_token %}
                <div class="modal-body um-modal-grid">
                    {% if form.non_field_errors %}
                        <div class="alert alert-danger" role="alert">
                            {{ form.non_field_errors }}
                        </div>
                    {% endif %}
                    <label class="um-field form-group um-field-inline mb-3">
                        {{ form.is_active }}<span>Is active</span>
                        <div class="text-danger small" data-error-for="is_active"></div>
                        {% if form.is_active.errors %}
                            <div class="text-danger small">{{ form.is_active.errors }}</div>
                        {% endif %}
                    </label>
                    {% if action_type == 'add' %}
                    <label class="um-field form-group um-field-inline mb-3">
                        {{ form.send_invite }}<span>Send invitation email/sms</span>
                        <div class="text-danger small" data-error-for="send_invite"></div>
                        {% if form.send_invite.errors %}
                            <div class="text-danger small">{{ form.send_invite.errors }}</div>
                        {% endif %}
                    </label>
                    {% endif %}
                    <label class="um-field form-group">
                        <span>Email</span>
                        {{ form.email }}
                        <div class="text-danger small" data-error-for="email"></div>
                        {% if form.email.errors %}
                            <div class="text-danger small">{{ form.email.errors }}</div>
                        {% endif %}
                    </label>
                    <label class="um-field form-group">
                        <span>Roles & Permissions</span>
                        {% include 'components/custom-select.html' with field=form.groups multiple=True placeholder='Select roles and permissions' search_placeholder='Search roles and permissions...' no_results_text='No roles found.' %}
                        <div class="text-danger small" data-error-for="groups"></div>
                        {% if form.groups.errors %}
                            <div class="text-danger small">{{ form.groups.errors }}</div>
                        {% endif %}
                    </label>
                    <label class="um-field form-group">
                        <span>First name</span>
                        {{ form.first_name }}
                        <div class="text-danger small" data-error-for="first_name"></div>
                        {% if form.first_name.errors %}
                            <div class="text-danger small">{{ form.first_name.errors }}</div>
                        {% endif %}
                    </label>
                    <label class="um-field form-group">
                        <span>Last name (optional)</span>
                        {{ form.last_name }}
                        <div class="text-danger small" data-error-for="last_name"></div>
                        {% if form.last_name.errors %}
                            <div class="text-danger small">{{ form.last_name.errors }}</div>
                        {% endif %}
                    </label>
                    <label class="um-field form-group" data-dashboard-hide-for-org-group-admin>
                        <span>Start date (optional)</span>
                        {{ form.start_date }}
                        <div class="text-danger small" data-error-for="start_date"></div>
                        {% if form.start_date.errors %}
                            <div class="text-danger small">{{ form.start_date.errors }}</div>
                        {% endif %}
                    </label>
                    <label class="um-field form-group" data-dashboard-hide-for-org-group-admin>
                        <span>End date (optional)</span>
                        {{ form.end_date }}
                        <div class="text-danger small" data-error-for="end_date"></div>
                        {% if form.end_date.errors %}
                            <div class="text-danger small">{{ form.end_date.errors }}</div>
                        {% endif %}
                    </label>
                    <label class="um-field form-group d-none" data-dashboard-org-group-field>
                        <span>Organisation group</span>
                        {% include 'components/custom-select.html' with field=form.organisation_group placeholder='Select organisation group' search_placeholder='Search organisation groups...' no_results_text='No organisation groups found.' %}
                        <div class="text-danger small" data-error-for="organisation_group"></div>
                        {% if form.organisation_group.errors %}
                            <div class="text-danger small">{{ form.organisation_group.errors }}</div>
                        {% endif %}
                    </label>
                    <label class="um-field form-group" data-dashboard-hide-for-org-group-admin>
                        <span>Organisation (optional)</span>
                        {% include 'components/custom-select.html' with field=form.organisation_data multiple=True placeholder='Select organisation' search_placeholder='Search organisation...' no_results_text='No organisations found.' %}
                        <div class="text-danger small" data-error-for="organisation_data"></div>
                        {% if form.organisation_data.errors %}
                            <div class="text-danger small">{{ form.organisation_data.errors }}</div>
                        {% endif %}
                    </label>
                    <label class="um-field form-group" data-dashboard-hide-for-org-group-admin>
                        <span>Factories (optional)</span>
                        {% include 'components/custom-select.html' with field=form.factories multiple=True placeholder='Select factories' search_placeholder='Search factories...' no_results_text='No factories found.' %}
                        <div class="text-danger small" data-error-for="factories"></div>
                        {% if form.factories.errors %}
                            <div class="text-danger small">{{ form.factories.errors }}</div>
                        {% endif %}
                    </label>
                    <label class="um-field form-group" data-dashboard-hide-for-org-group-admin>
                        <span>Scheme (optional)</span>
                        {% include 'components/custom-select.html' with field=form.scheme placeholder='Select scheme' search_placeholder='Search schemes...' no_results_text='No schemes found.' %}
                        <div class="text-danger small" data-error-for="scheme"></div>
                        {% if form.scheme.errors %}
                            <div class="text-danger small">{{ form.scheme.errors }}</div>
                        {% endif %}
                    </label>
                    <label class="um-field form-group" data-dashboard-hide-for-org-group-admin>
                        <span>Destinations (optional)</span>
                        {% include 'components/custom-select.html' with field=form.destinations multiple=True placeholder='Select destinations' search_placeholder='Search destinations...' no_results_text='No destinations found.' %}
                        <div class="text-danger small" data-error-for="destinations"></div>
                        {% if form.destinations.errors %}
                            <div class="text-danger small">{{ form.destinations.errors }}</div>
                        {% endif %}
                    </label>
                    <label class="um-field form-group" data-dashboard-hide-for-org-group-admin>
                        <span>Excluded origin countries (optional)</span>
                        {% include 'components/custom-select.html' with field=form.excluded_origin_countries multiple=True placeholder='Select excluded origin countries' search_placeholder='Search origin countries...' no_results_text='No origin countries found.' %}
                        <div class="text-danger small" data-error-for="excluded_origin_countries"></div>
                        {% if form.excluded_origin_countries.errors %}
                            <div class="text-danger small">{{ form.excluded_origin_countries.errors }}</div>
                        {% endif %}
                    </label>
                    <label class="um-field form-group" data-dashboard-hide-for-org-group-admin>
                        <span>User languages (optional)</span>
                        {% include 'components/custom-select.html' with field=form.user_languages multiple=True placeholder='Select user languages' search_placeholder='Search languages...' no_results_text='No languages found.' %}
                        <div class="text-danger small" data-error-for="user_languages"></div>
                        {% if form.user_languages.errors %}
                            <div class="text-danger small">{{ form.user_languages.errors }}</div>
                        {% endif %}
                    </label>
                    <label class="um-field form-group" data-dashboard-hide-for-org-group-admin>
                        <span>Immigration status (optional)</span>
                        {% include 'components/custom-select.html' with field=form.immigration_status multiple=True placeholder='Select immigration statuses' search_placeholder='Search immigration statuses...' no_results_text='No immigration statuses found.' %}
                        <div class="text-danger small" data-error-for="immigration_status"></div>
                        {% if form.immigration_status.errors %}
                            <div class="text-danger small">{{ form.immigration_status.errors }}</div>
                        {% endif %}
                    </label>
                </div>
                <div class="um-modal-footer modal-footer">
                    <button type="button" class="um-btn um-btn-gray" data-dismiss="modal">
                        Cancel
                    </button>
                    <button type="submit" class="um-btn um-btn-lime px-4">{{ submit_label }}</button>
                </div>
            </form>
        </div>
    </div>
</div>
