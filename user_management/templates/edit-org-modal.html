<div class="modal fade" id="edit-org-modal" tabindex="-1" role="dialog" aria-labelledby="edit-org-title" aria-hidden="true" data-home-url="{% url 'user_management:home' %}">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="um-modal-title um-navy" id="edit-org-title">Edit organisation</h5>
                <button type="button" class="close" data-dismiss="modal" data-bs-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="um-modal-divider"></div>
            <form id="edit-org-form" method="post" action="" data-home-url="{% url 'user_management:home' %}" data-base-url="{% url 'user_management:home' %}organisations/">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="alert alert-danger d-none" id="edit-org-form-error" role="alert"></div>
                    <label class="um-field form-group mt-1">
                        <span>Name</span>
                        <input type="text" name="name" id="edit-org-name" class="form-control um-input" placeholder="Organisation name" />
                        <div class="text-danger small" data-error-for="name"></div>
                    </label>
                    <label class="um-field form-group">
                        <span>Code</span>
                        <input type="text" name="org_code" id="edit-org-code" class="form-control um-input" placeholder="Organisation code" />
                        <div class="text-danger small" data-error-for="org_code"></div>
                    </label>
                </div>
                <div class="um-modal-footer modal-footer">
                    <button type="button" class="um-btn um-btn-gray" data-dismiss="modal" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button type="submit" class="um-btn um-btn-lime px-4">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
