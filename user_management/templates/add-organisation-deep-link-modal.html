<div class="modal fade" id="add-organisation-deep-link-modal" tabindex="-1" role="dialog" aria-labelledby="add-organisation-deep-link-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="um-modal-title um-navy" id="add-organisation-deep-link-title" data-deep-link-modal-title>{{ modal_title }}</h5>
                <button
                    type="button"
                    class="close"
                    data-dismiss="modal"
                    data-bs-dismiss="modal"
                    data-deep-link-close
                    aria-label="Close"
                >
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="alert alert-danger d-none" id="add-organisation-deep-link-form-error" role="alert"></div>
            <div class="um-modal-divider"></div>
            <form id="add-organisation-deep-link-form" method="post" action="{{ form_action }}" data-create-action="{{ form_action }}" data-request-method="POST">
                {% csrf_token %}
                <div class="modal-body">
                    <input type="hidden" name="selected_org_id" data-selected-org-id value="" />
                    <input type="hidden" name="deep_link_id" data-deep-link-id value="" />
                    <label class="um-field form-group d-block">
                        <span>Title (Required)</span>
                        {{ form.title }}
                        <div class="text-danger small" data-error-for="title"></div>
                        {% if form.title.errors %}
                            <div class="text-danger small">{{ form.title.errors }}</div>
                        {% endif %}
                    </label>
                    <label class="um-field form-group d-block">
                        <span>Link type (Required)</span>
                        {{ form.link_type }}
                        <div class="text-danger small" data-error-for="link_type"></div>
                        {% if form.link_type.errors %}
                            <div class="text-danger small">{{ form.link_type.errors }}</div>
                        {% endif %}
                    </label>
                    <label class="um-field form-group d-block">
                        <span>Destination (Required)</span>
                        {% include 'components/custom-select.html' with field=form.destination placeholder='Select destination' search_placeholder='Search destination...' no_results_text='No destinations found.' %}
                        <div class="text-danger small" data-error-for="destination"></div>
                        {% if form.destination.errors %}
                            <div class="text-danger small">{{ form.destination.errors }}</div>
                        {% endif %}
                    </label>
                    <label class="um-field form-group d-block">
                        <span>Access code (Optional)</span>
                        {% include 'components/custom-select.html' with field=form.access_code placeholder='Select access code' search_placeholder='Search access code...' no_results_text='No access codes found.' %}
                        <div class="text-danger small" data-error-for="access_code"></div>
                        {% if form.access_code.errors %}
                            <div class="text-danger small">{{ form.access_code.errors }}</div>
                        {% endif %}
                    </label>
                    <label class="um-field form-group d-block">
                        <span>Sectors (Optional)</span>
                        {% include 'components/custom-select.html' with field=form.sectors placeholder='Select sector' search_placeholder='Search sector...' no_results_text='No sectors found.' %}
                        <div class="text-danger small" data-error-for="sectors"></div>
                        {% if form.sectors.errors %}
                            <div class="text-danger small">{{ form.sectors.errors }}</div>
                        {% endif %}
                    </label>
                    <label class="um-field form-group d-block">
                        <span>Immigration status (Optional)</span>
                        {% include 'components/custom-select.html' with field=form.immigration_status placeholder='Select immigration status' search_placeholder='Search immigration status...' no_results_text='No immigration statuses found.' %}
                        <div class="text-danger small" data-error-for="immigration_status"></div>
                        {% if form.immigration_status.errors %}
                            <div class="text-danger small">{{ form.immigration_status.errors }}</div>
                        {% endif %}
                    </label>
                </div>
                <div class="um-modal-footer modal-footer">
                    <button
                        type="button"
                        class="um-btn um-btn-gray"
                        data-dismiss="modal"
                        data-bs-dismiss="modal"
                        data-deep-link-close
                    >
                        Cancel
                    </button>
                    <button type="submit" class="um-btn um-btn-lime px-4" data-deep-link-submit>{{ submit_label }}</button>
                </div>
            </form>
        </div>
    </div>
</div>
