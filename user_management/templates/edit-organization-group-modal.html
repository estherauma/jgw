<div class="modal fade" id="edit-organization-group-modal" tabindex="-1" role="dialog" aria-labelledby="edit-organization-group-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="um-modal-title um-navy" id="edit-organization-group-title">{{ modal_title }}</h5>
                <button type="button" class="close" data-dismiss="modal" data-bs-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="um-modal-divider"></div>
            <form id="edit-organization-group-form" method="post" action="{{ form_action }}">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="alert alert-danger d-none" id="edit-organization-group-form-error" role="alert"></div>
                    {% if form.non_field_errors %}
                        <div class="alert alert-danger" role="alert">
                            {{ form.non_field_errors }}
                        </div>
                    {% endif %}
                    <label class="um-field form-group mt-1">
                        <span>Brand name</span>
                        {{ form.name }}
                        <div class="text-danger small" data-error-for="name"></div>
                    </label>
                </div>
                <div class="um-modal-footer modal-footer">
                    <button type="button" class="um-btn um-btn-gray" data-dismiss="modal" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button type="submit" class="um-btn um-btn-lime px-4">{{ submit_label }}</button>
                </div>
            </form>
        </div>
    </div>
</div>
