{% load um_waffle_flags %}
{% flag 'can_create_login_qr_code' %}
<button
    class="dropdown-item um-actions-item"
    type="button"
    role="menuitem"
    data-edit-organisation-deep-link
    data-deep-link-detail-url="{% url 'user_management:deep_link_detail' deep_link.id %}"
>
    Edit
</button>
{% endflag %}
<button
    class="dropdown-item um-actions-item"
    type="button"
    role="menuitem"
    data-view-deep-link-qr
    data-qr-code-title="{{ deep_link.title|default:'Organisation link' }}"
    data-qr-code-link="{{ deep_link.link }}"
    data-qr-code-url="{{ deep_link.qr_code_url }}"
>
    QR code
</button>
{% flag 'can_create_login_qr_code' %}
<button
    class="dropdown-item um-actions-item text-danger"
    type="button"
    role="menuitem"
    data-delete-organisation-deep-link
    data-delete-url="{% url 'user_management:delete_deep_link' deep_link.id %}"
    data-deep-link-title="{{ deep_link.title|default:'Organisation link' }}"
>
    Delete
</button>
{% endflag %}
