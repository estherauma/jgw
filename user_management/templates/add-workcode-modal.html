<div class="modal fade" id="{{ action_type }}-workcode-modal" tabindex="-1" role="dialog" aria-labelledby="{{ action_type }}-workcode-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="um-modal-title um-navy" id="{{ action_type }}-workcode-modal-title">{{ modal_title }}</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="um-modal-divider"></div>
            <form id="{{ action_type }}-workcode-form" method="post" action="{{ form_action }}" >
                {% csrf_token %}
                <div class="modal-body">
                    <div class="alert alert-danger d-none" id="{{ action_type }}-workcode-form-error" role="alert"></div>
                    {% if form.non_field_errors %}
                        <div class="alert alert-danger" role="alert">
                            {{ form.non_field_errors }}
                        </div>
                    {% endif %}
                    <input type="hidden" name="selected_org_id" data-selected-org-id />
                    <div class="um-navy mb-2">
                        Organisation: <span class="fw-bold" data-workcode-org-label>None selected</span>
                    </div>
                    <label class="um-field form-group mt-1">
                        <span>Work code</span>
                        {{ form.code }}
                        <div class="text-danger small" data-error-for="code"></div>
                        {% if form.code.errors %}
                            <div class="text-danger small">{{ form.code.errors }}</div>
                        {% endif %}
                    </label>
                    <label class="um-field form-group mt-2">
                        <span>Expiry date (Optional)</span>
                        <div class="d-flex align-items-center gap-2">
                            {{ form.expiry_date }}
                            <button type="button" data-reset-for="expiry_date"
                                class="btn btn-link p-0 text-dark text-decoration-none d-none" 
                                style="font-size: 1.2rem; font-weight: bold;"
                                >
                                &times;
                            </button>
                        </div>
                        <div class="text-danger small" data-error-for="expiry_date"></div>
                        {% if form.expiry_date.errors %}
                            <div class="text-danger small">{{ form.expiry_date.errors }}</div>
                        {% endif %}
                    </label>
                    <div class="form-check form-switch mt-2">
                        {{ form.requires_login }}
                        <label class="form-check-label" for="{{ form.requires_login.id_for_label }}">
                            Require authentication to use this code.
                        </label>
                        <div class="text-danger small" data-error-for="requires_login"></div>
                        {% if form.requires_login.errors %}
                            <div class="text-danger small">{{ form.requires_login.errors }}</div>
                        {% endif %}
                    </div>
                </div>
                <div class="um-modal-footer modal-footer">
                    <button type="button" class="um-btn um-btn-gray" data-dismiss="modal">
                        Cancel
                    </button>
                    <button type="submit" class="um-btn um-btn-lime px-4">{{ submit_label }}</button>
                </div>
            </form>
        </div>
    </div>
</div>
