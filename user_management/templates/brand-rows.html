{% if brands %}
    {% for brand in brands %}
    <tr data-brand-row>
        <td>{{ forloop.counter }}</td>
        <td>{{ brand.name }}</td>
        <td>{{ brand.brand_code }}</td>
    </tr>
    {% endfor %}
{% else %}
    <tr data-brand-row>
        <td colspan="3">No brands found.</td>
    </tr>
{% endif %}
