{% load um_waffle_flags %}
{% flag 'can_select_organization' %}
<div class="um-card um-navy mb-2">
  <div class="um-card-title">Selected organisation</div>
  <div class="um-row">
    <div class="input-group">
      <div
        class="um-select"
        data-org-select
        data-org-options-url="{% url 'user_management:organisation_search_options' %}"
        {% if selected_id %}data-initial-org-id="{{ selected_id }}"{% endif %}
        {% if selected %}data-initial-org-label="{{ selected }}"{% endif %}
      >
        <button class="um-select-toggle rounded-pill fw-bold text-start" type="button" data-org-toggle>
          <span data-org-selected-label>
            {% if selected %}{{ selected }}{% else %}Select organisation{% endif %}
          </span>
          <i class="bi bi-chevron-down"></i>
        </button>
        <div class="um-select-menu" data-org-menu>
          <input
            class="form-control"
            type="text"
            placeholder="Search organisation..."
            aria-label="Search organisation"
            data-org-filter
          />
          <div class="um-select-options" data-org-options></div>
        </div>
        <input type="hidden" name="selected_org" data-org-hidden value="{{ selected_id|default:'' }}" />
      </div>
    </div>
    <div class="d-inline-flex align-items-center gap-5" >
      <button
        class="um-btn-icon"
        type="button"
        data-org-clear
        data-org-dependent
        aria-label="Clear selection"
        title="Clear selection"
      >
        <i class="bi bi-x-circle"></i>
      </button>
    </div>
  </div>
  <div class="um-navy mt-2 mb-3">
    This is where you can assign work codes, add users and view organisation details.
  </div>
</div>
<script>
(function () {
  function initOrgDropdown() {
    const wrapper = document.querySelector('[data-org-select]');
    if (!wrapper || !window.createAsyncOrganisationPicker) {
      return;
    }
    let initialOrgId = wrapper.getAttribute('data-initial-org-id') || '';
    let initialOrgLabel = wrapper.getAttribute('data-initial-org-label') || '';

    function updateDetails(option) {
      const detailMap = {
        name: option.name,
        code: option.code,
        created_at: option.created_at,
      };
      Object.keys(detailMap).forEach(function (key) {
        const target = document.querySelector('[data-org-detail="' + key + '"]');
        if (target && detailMap[key]) {
          target.textContent = detailMap[key];
        }
      });
    }

    function resetDetails() {
      const details = document.querySelectorAll('[data-org-detail]');
      details.forEach(function (item) {
        const fallback = item.getAttribute('data-org-default') || 'N/A';
        item.textContent = fallback;
      });
    }

    function updateQueryParam(orgId, navigate) {
      if (!window.history || !window.history.replaceState) {
        return;
      }
      const url = new URL(window.location.href);
      if (orgId) {
        url.searchParams.set('selected_org_id', orgId);
      } else {
        url.searchParams.delete('selected_org_id');
      }
      if (navigate) {
        window.location.href = url.toString();
      } else {
        window.history.replaceState({}, '', url.toString());
      }
    }

    function filterWorkCodes(orgId) {
      const items = document.querySelectorAll('[data-org-workcode]');
      let visibleCount = 0;
      items.forEach(function (item) {
        const matches = item.getAttribute('data-org-id') === orgId;
        item.hidden = !matches;
        if (matches) {
          visibleCount += 1;
        }
      });
      const emptyState = document.querySelector('[data-org-workcode-empty]');
      if (emptyState) {
        emptyState.classList.toggle('d-none', visibleCount > 0);
      }
    }

    window.updateOrgWorkCodeFilter = filterWorkCodes;

    function syncWorkCodeForm(orgId) {
      const form = document.getElementById('add-workcode-form');
      if (!form) {
        return;
      }
      const action = form.getAttribute('action');
      if (!action) {
        return;
      }
      const url = new URL(action, window.location.origin);
      if (orgId) {
        url.searchParams.set('selected_org_id', orgId);
      } else {
        url.searchParams.delete('selected_org_id');
      }
      form.setAttribute('action', url.toString());
    }

    function toggleDependents(show) {
      const dependents = document.querySelectorAll('[data-org-dependent]');
      dependents.forEach(function (el) {
        el.hidden = !show;
      });
    }
    const picker = window.createAsyncOrganisationPicker(wrapper, {
      toggleSelector: '[data-org-toggle]',
      menuSelector: '[data-org-menu]',
      searchInputSelector: '[data-org-filter]',
      optionsContainerSelector: '[data-org-options]',
      hiddenInputSelector: '[data-org-hidden]',
      labelSelector: '[data-org-selected-label]',
      initialIdAttribute: 'data-initial-org-id',
      initialLabelAttribute: 'data-initial-org-label',
      placeholder: 'Select organisation',
      onSelect: function (option) {
        if (window.storeSelectedOrganisation) {
          window.storeSelectedOrganisation(option.id, option.label);
        }
        toggleDependents(true);
        updateDetails(option);
        filterWorkCodes(option.id);
        syncWorkCodeForm(option.id);
        const current =
          new URL(window.location.href).searchParams.get('selected_org_id') || '';
        updateQueryParam(option.id, current !== option.id);
      },
      onClear: function () {
        resetDetails();
        toggleDependents(false);
        filterWorkCodes('');
        syncWorkCodeForm('');
        if (window.storeSelectedOrganisation) {
          window.storeSelectedOrganisation('', '');
        }
      },
    });

    if (initialOrgId) {
      if (window.storeSelectedOrganisation) {
        window.storeSelectedOrganisation(initialOrgId, initialOrgLabel);
      }
      toggleDependents(true);
      filterWorkCodes(initialOrgId);
      syncWorkCodeForm(initialOrgId);
    } else {
      toggleDependents(false);
      filterWorkCodes('');
      syncWorkCodeForm('');
    }

    const clearButton = document.querySelector('[data-org-clear]');
    if (clearButton && picker) {
      clearButton.addEventListener('click', function () {
        initialOrgId = '';
        initialOrgLabel = '';
        picker.clear(true);
        updateQueryParam('', true);
      });
    }
  }

  window.addEventListener('load', initOrgDropdown);
})();
</script>
{% endflag %}
