<div class="modal fade" id="edit-org-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title um-navy fw-bold">Organisation Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="edit-org-form" method="post">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="form-group mb-3">
                        <label class="um-navy small fw-bold">Name</label>
                        <input type="text" name="name" id="edit-name" class="form-control rounded-pill border-secondary">
                    </div>
                    <div class="form-group mb-3">
                        <label class="um-navy small fw-bold">Code</label>
                        <input type="text" name="org_code" id="edit-code" class="form-control rounded-pill border-secondary">
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary rounded-pill px-4">Update</button>
                </div>
            </form>
        </div>
    </div>
</div>
