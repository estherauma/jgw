<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Set up your account</title>
  </head>
  <body>
    <p>Hello,</p>
    {% if organisation_name %}
    <p>You have been added to {{ organisation_name }}.</p>
    {% endif %}
    <p>Use this link to set your password and finish setup:</p>
    <p><a href="{{ reset_link }}">Set your password</a></p>
    <p>This link expires in 3 days.</p>
    <p>Thanks,</p>
    <p>JGW team</p>
    <hr />
    <p>If this was not for you, you can ignore this email.</p>
  </body>
</html>
