name: Deploy to Staging

on:
  repository_dispatch:
    types: [build-success]
  # Keep the original trigger for manual deployments
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (default: latest)'
        required: false
        default: 'latest'
        type: string

env:
  DEPLOYMENT_ENV: staging
  DEPLOYMENT_BRANCH: develop

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_PRIVATE_KEY }}" > ~/.ssh/staging-deploy
          chmod 600 ~/.ssh/staging-deploy
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Set deployment variables
        id: set-vars
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "image_name=${{ github.event.client_payload.image_name }}" >> $GITHUB_OUTPUT
            echo "image_tag=latest" >> $GITHUB_OUTPUT
            echo "commit_sha=${{ github.event.client_payload.commit }}" >> $GITHUB_OUTPUT
            echo "actor=${{ github.event.client_payload.actor }}" >> $GITHUB_OUTPUT
            echo "triggered_by=build-success" >> $GITHUB_OUTPUT
          else
            echo "image_name=fiftyeight/jgw-pandas-staging" >> $GITHUB_OUTPUT
            echo "image_tag=${{ github.event.inputs.image_tag || 'latest' }}" >> $GITHUB_OUTPUT
            echo "commit_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "actor=${{ github.actor }}" >> $GITHUB_OUTPUT
            echo "triggered_by=manual" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Staging
        run: |
          ssh -i ~/.ssh/staging-deploy ${{ secrets.STAGING_USERNAME }}@${{ secrets.STAGING_HOST }} << EOF
            cd ~/jgw-pandas
            
            echo "=== Staging Deployment Started ==="
            echo "Image: ${{ steps.set-vars.outputs.image_name }}:${{ steps.set-vars.outputs.image_tag }}"
            echo "Commit: ${{ steps.set-vars.outputs.commit_sha }}"
            echo "Triggered by: ${{ steps.set-vars.outputs.triggered_by }}"
            echo "Actor: ${{ steps.set-vars.outputs.actor }}"
            
            echo "Pulling latest code from develop branch..."
            git pull origin develop
            
            echo "Logging into Docker Hub..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            echo "Pulling latest images..."
            sudo docker compose -f docker-compose.staging.yml pull
            
            echo "Stopping containers..."
            sudo docker compose -f docker-compose.staging.yml down
            
            echo "Starting containers with latest images..."
            sudo docker compose -f docker-compose.staging.yml up -d
            
            echo "Cleaning up unused images..."
            sudo docker image prune -f
            
            echo "=== Staging deployment completed! ==="
          EOF

      - name: Notify Slack - Staging Success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#deployments'
          text: |
            🚀 **Staging Deployment Successful**
            Environment: Staging
            Image: ${{ steps.set-vars.outputs.image_name }}:${{ steps.set-vars.outputs.image_tag }}
            Branch: ${{ env.DEPLOYMENT_BRANCH }}
            Commit: ${{ steps.set-vars.outputs.commit_sha }}
            Author: ${{ steps.set-vars.outputs.actor }}
            Triggered by: ${{ steps.set-vars.outputs.triggered_by }}
            URL: https://github.com/${{ github.repository }}/commit/${{ steps.set-vars.outputs.commit_sha }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Notify Slack - Staging Failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#deployments'
          text: |
            ❌ **Staging Deployment Failed**
            Environment: Staging
            Image: ${{ steps.set-vars.outputs.image_name }}:${{ steps.set-vars.outputs.image_tag }}
            Branch: ${{ env.DEPLOYMENT_BRANCH }}
            Commit: ${{ steps.set-vars.outputs.commit_sha }}
            Author: ${{ steps.set-vars.outputs.actor }}
            Triggered by: ${{ steps.set-vars.outputs.triggered_by }}
            Check the logs for details.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
