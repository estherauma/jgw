name: Build and Deploy to Staging

on:
  push:
    branches:
      - develop

env:
  REGISTRY: docker.io
  IMAGE_NAME: fiftyeight/jgw-pandas-staging
  DEPLOYMENT_ENV: staging
  DEPLOYMENT_BRANCH: develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # ===========================================
      # BUILD PHASE
      # ===========================================
      
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Clean up local Docker cache
        run: |
          echo "Cleaning up local Docker cache..."
          docker system prune -a -f
          docker builder prune -a -f
          echo "Docker cache cleaned up"

      - name: Debug secrets
        run: |
          echo "DOCKERHUB_USERNAME length: ${#DOCKERHUB_USERNAME}"
          echo "DOCKERHUB_TOKEN length: ${#DOCKERHUB_TOKEN}"
          echo "GOOGLE_CREDENTIALS_BASE64 length: ${#GOOGLE_CREDENTIALS_BASE64}"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GOOGLE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          registry: docker.io

      - name: Clean up old Docker Hub images (keep recent for rollback)
        run: |
          # Configuration
          KEEP_RECENT_IMAGES=2
          PROTECTED_TAGS="latest develop"
          MAX_TAGS_FETCH=100
          
          echo "🧹 Cleaning up old images from Docker Hub..."
          echo "📋 Retention policy: Keep last $KEEP_RECENT_IMAGES images + protected tags ($PROTECTED_TAGS)"
          
          # Get authentication token
          AUTH_TOKEN=$(curl -s -H "Content-Type: application/json" -X POST --data '{"username": "${{ secrets.DOCKERHUB_USERNAME }}", "password": "${{ secrets.DOCKERHUB_TOKEN }}"}' https://hub.docker.com/v2/users/login/ | jq -r .token)
          
          if [ "$AUTH_TOKEN" = "null" ] || [ -z "$AUTH_TOKEN" ]; then
            echo "❌ Failed to authenticate with Docker Hub"
            exit 1
          fi
          
          # Get all tags sorted by last_updated (newest first)
          TAGS_RESPONSE=$(curl -s -H "Authorization: JWT $AUTH_TOKEN" "https://hub.docker.com/v2/repositories/${{ env.IMAGE_NAME }}/tags/?page_size=$MAX_TAGS_FETCH&ordering=-last_updated")
          
          if echo "$TAGS_RESPONSE" | jq -e '.results' > /dev/null 2>&1; then
            # Get total count
            TOTAL_TAGS=$(echo "$TAGS_RESPONSE" | jq -r '.count')
            echo "📊 Total tags in repository: $TOTAL_TAGS"
            
            # Get all tags except protected ones
            ALL_TAGS=$(echo "$TAGS_RESPONSE" | jq -r '.results[] | select(.name as $tag | ("$PROTECTED_TAGS" | split(" ") | index($tag) | not)) | .name')
            
            # Keep the most recent ones (skip the last KEEP_RECENT_IMAGES)
            TAGS_TO_DELETE=$(echo "$ALL_TAGS" | head -n -$KEEP_RECENT_IMAGES)
            
            if [ -n "$TAGS_TO_DELETE" ]; then
              echo ""
              echo "📋 Current tags (keeping last $KEEP_RECENT_IMAGES + protected tags):"
              echo "$TAGS_RESPONSE" | jq -r '.results[] | "  • \(.name) (updated: \(.last_updated))"' | head -10
              
              echo ""
              echo "🗑️  Tags to delete (keeping last $KEEP_RECENT_IMAGES for rollback):"
              echo "$TAGS_TO_DELETE" | while read -r tag; do
                echo "  • $tag"
              done
              
              echo ""
              echo "Deleting old tags..."
              DELETED_COUNT=0
              FAILED_COUNT=0
              
              echo "$TAGS_TO_DELETE" | while read -r tag; do
                if [ -n "$tag" ]; then
                  echo "Deleting tag: $tag"
                  DELETE_RESPONSE=$(curl -s -X DELETE -H "Authorization: JWT $AUTH_TOKEN" "https://hub.docker.com/v2/repositories/${{ env.IMAGE_NAME }}/tags/$tag/")
                  
                  if echo "$DELETE_RESPONSE" | jq -e '.detail' > /dev/null 2>&1; then
                    echo "  ❌ Failed to delete $tag: $(echo "$DELETE_RESPONSE" | jq -r '.detail')"
                    FAILED_COUNT=$((FAILED_COUNT + 1))
                  else
                    echo "  ✅ Successfully deleted $tag"
                    DELETED_COUNT=$((DELETED_COUNT + 1))
                  fi
                fi
              done
              
              echo ""
              echo "✅ Cleanup completed:"
              echo "  • Kept last $KEEP_RECENT_IMAGES images for rollback"
              echo "  • Protected tags: $PROTECTED_TAGS"
              echo "  • Total tags remaining: $((TOTAL_TAGS - $(echo "$TAGS_TO_DELETE" | wc -l)))"
            else
              echo "ℹ️  No old tags found to clean up (keeping all for rollback)"
              echo "  • Total tags: $TOTAL_TAGS"
              echo "  • All tags are recent or protected"
            fi
          else
            echo "❌ Failed to fetch tags from Docker Hub"
            echo "Response: $TAGS_RESPONSE"
            exit 1
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=develop,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GOOGLE_CREDENTIALS_BASE64=${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      # ===========================================
      # DEPLOYMENT PHASE
      # ===========================================

      - name: Setup SSH for Staging
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_PRIVATE_KEY }}" > ~/.ssh/staging-deploy
          chmod 600 ~/.ssh/staging-deploy
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Set deployment variables
        id: set-vars
        run: |
          echo "image_name=${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT
          echo "image_tag=latest" >> $GITHUB_OUTPUT
          echo "commit_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "actor=${{ github.actor }}" >> $GITHUB_OUTPUT
          echo "triggered_by=build-success" >> $GITHUB_OUTPUT
          
          # Log deployment information
          echo "=== Deployment Information ==="
          echo "Image: ${{ env.IMAGE_NAME }}:latest"
          echo "Tags built: ${{ steps.meta.outputs.tags }}"
          echo "Branch: ${{ env.DEPLOYMENT_BRANCH }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Triggered by: build-success"

      - name: Deploy to Staging
        run: |
          ssh -i ~/.ssh/staging-deploy ${{ secrets.STAGING_USERNAME }}@${{ secrets.STAGING_HOST }} << EOF
            cd ~/jgw-pandas
            
            echo "=== Staging Deployment Started ==="
            echo "Image: ${{ steps.set-vars.outputs.image_name }}:${{ steps.set-vars.outputs.image_tag }}"
            echo "Commit: ${{ steps.set-vars.outputs.commit_sha }}"
            echo "Triggered by: ${{ steps.set-vars.outputs.triggered_by }}"
            echo "Actor: ${{ steps.set-vars.outputs.actor }}"
            
            echo "Pulling latest code from develop branch..."
            git pull origin develop
            
            echo "Logging into Docker Hub..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            echo "Pulling latest images..."
            sudo docker compose -f docker-compose.staging.yml pull
            
            echo "Stopping containers..."
            sudo docker compose -f docker-compose.staging.yml down
            
            echo "Starting containers with latest images..."
            sudo docker compose -f docker-compose.staging.yml up -d
            
            echo "Cleaning up unused images..."
            sudo docker image prune -f
            
            echo "=== Staging deployment completed! ==="
          EOF

      # ===========================================
      # NOTIFICATIONS
      # ===========================================

      - name: Notify Slack - Build and Deploy Success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#deployments'
          text: |
            🚀 **Build and Deploy to Staging Successful**
            Environment: Staging
            Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            Tags: ${{ steps.meta.outputs.tags }}
            Branch: ${{ env.DEPLOYMENT_BRANCH }}
            Commit: ${{ github.sha }}
            Deployed by: ${{ github.actor }}
            ✨ Old images cleaned up, kept last 2 + latest + develop for rollback
            ✅ **Staging environment updated successfully!**
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Notify Slack - Build Failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#deployments'
          text: |
            ❌ **Build and Deploy to Staging Failed**
            Environment: Staging
            Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            Branch: ${{ env.DEPLOYMENT_BRANCH }}
            Commit: ${{ github.sha }}
            Deployed by: ${{ github.actor }}
            Check the logs for details.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
