name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (default: latest)'
        required: false
        default: 'latest'
        type: string
      confirm_deployment:
        description: 'Confirm you want to deploy to production'
        required: true
        type: boolean
        default: false

env:
  DEPLOYMENT_ENV: production
  DEPLOYMENT_BRANCH: develop
  IMAGE_NAME: fiftyeight/jgw-pandas-staging

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    if: github.event.inputs.confirm_deployment == 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: develop

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}" > ~/.ssh/production-deploy
          chmod 600 ~/.ssh/production-deploy
          ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Set deployment variables
        id: set-vars
        run: |
          echo "image_name=${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT
          echo "image_tag=${{ github.event.inputs.image_tag || 'latest' }}" >> $GITHUB_OUTPUT
          echo "commit_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "actor=${{ github.actor }}" >> $GITHUB_OUTPUT
          echo "triggered_by=manual" >> $GITHUB_OUTPUT

      - name: Deploy to Production
        run: |
          ssh -i ~/.ssh/production-deploy ${{ secrets.USERNAME }}@${{ secrets.PRODUCTION_HOST }} << EOF
            cd ~/jgw-pandas
            
            echo "=== Production Deployment Started ==="
            echo "Image: ${{ steps.set-vars.outputs.image_name }}:${{ steps.set-vars.outputs.image_tag }}"
            echo "Commit: ${{ steps.set-vars.outputs.commit_sha }}"
            echo "Triggered by: ${{ steps.set-vars.outputs.triggered_by }}"
            echo "Actor: ${{ steps.set-vars.outputs.actor }}"
            
            echo "Pulling latest code from develop branch..."
            git pull origin develop
            
            echo "Logging into Docker Hub..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            echo "Pulling latest images..."
            sudo docker compose -f docker-compose.production.yml pull
            
            echo "Stopping containers..."
            sudo docker compose -f docker-compose.production.yml down
            
            echo "Starting containers with latest images..."
            sudo docker compose -f docker-compose.production.yml up -d
            
            echo "Cleaning up unused images..."
            sudo docker image prune -f
            
            echo "=== Production deployment completed! ==="
          EOF

      - name: Notify Slack - Production Success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#deployments'
          text: |
            🎉 **Production Deployment Successful**
            Environment: Production
            Image: ${{ steps.set-vars.outputs.image_name }}:${{ steps.set-vars.outputs.image_tag }}
            Branch: ${{ env.DEPLOYMENT_BRANCH }}
            Commit: ${{ steps.set-vars.outputs.commit_sha }}
            Deployed by: ${{ steps.set-vars.outputs.actor }}
            Triggered by: ${{ steps.set-vars.outputs.triggered_by }}
            URL: https://github.com/${{ github.repository }}/commit/${{ steps.set-vars.outputs.commit_sha }}
            ⚠️  **This is now LIVE in production!**
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Notify Slack - Production Failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#deployments'
          text: |
            🚨 **Production Deployment Failed**
            Environment: Production
            Image: ${{ steps.set-vars.outputs.image_name }}:${{ steps.set-vars.outputs.image_tag }}
            Branch: ${{ env.DEPLOYMENT_BRANCH }}
            Commit: ${{ steps.set-vars.outputs.commit_sha }}
            Deployed by: ${{ steps.set-vars.outputs.actor }}
            Triggered by: ${{ steps.set-vars.outputs.triggered_by }}
            ⚠️  **URGENT: Production deployment failed!**
            Check the logs immediately.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true