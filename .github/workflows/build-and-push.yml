name: Build and Push Docker Images

on:
  push:
    branches:
      - develop

env:
  REGISTRY: docker.io
  IMAGE_NAME: fiftyeight/jgw-pandas-staging

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Clean up local Docker cache
        run: |
          echo "Cleaning up local Docker cache..."
          docker system prune -a -f
          docker builder prune -a -f
          echo "Docker cache cleaned up"

      - name: Debug secrets
        run: |
          echo "DOCKERHUB_USERNAME length: ${#DOCKERHUB_USERNAME}"
          echo "DOCKERHUB_TOKEN length: ${#DOCKERHUB_TOKEN}"
          echo "GOOGLE_CREDENTIALS_BASE64 length: ${#GOOGLE_CREDENTIALS_BASE64}"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GOOGLE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          registry: docker.io

      - name: Clean up old Docker Hub images (keep recent for rollback)
        run: |
          # Configuration
          KEEP_RECENT_IMAGES=2
          PROTECTED_TAGS="latest develop"
          MAX_TAGS_FETCH=100
          
          echo "🧹 Cleaning up old images from Docker Hub..."
          echo "📋 Retention policy: Keep last $KEEP_RECENT_IMAGES images + protected tags ($PROTECTED_TAGS)"
          
          # Get authentication token
          AUTH_TOKEN=$(curl -s -H "Content-Type: application/json" -X POST --data '{"username": "${{ secrets.DOCKERHUB_USERNAME }}", "password": "${{ secrets.DOCKERHUB_TOKEN }}"}' https://hub.docker.com/v2/users/login/ | jq -r .token)
          
          if [ "$AUTH_TOKEN" = "null" ] || [ -z "$AUTH_TOKEN" ]; then
            echo "❌ Failed to authenticate with Docker Hub"
            exit 1
          fi
          
          # Get all tags sorted by last_updated (newest first)
          TAGS_RESPONSE=$(curl -s -H "Authorization: JWT $AUTH_TOKEN" "https://hub.docker.com/v2/repositories/${{ env.IMAGE_NAME }}/tags/?page_size=$MAX_TAGS_FETCH&ordering=-last_updated")
          
          if echo "$TAGS_RESPONSE" | jq -e '.results' > /dev/null 2>&1; then
            # Get total count
            TOTAL_TAGS=$(echo "$TAGS_RESPONSE" | jq -r '.count')
            echo "📊 Total tags in repository: $TOTAL_TAGS"
            
            # Get all tags except protected ones
            ALL_TAGS=$(echo "$TAGS_RESPONSE" | jq -r '.results[] | select(.name as $tag | ("$PROTECTED_TAGS" | split(" ") | index($tag) | not)) | .name')
            
            # Keep the most recent ones (skip the last KEEP_RECENT_IMAGES)
            TAGS_TO_DELETE=$(echo "$ALL_TAGS" | head -n -$KEEP_RECENT_IMAGES)
            
            if [ -n "$TAGS_TO_DELETE" ]; then
              echo ""
              echo "📋 Current tags (keeping last $KEEP_RECENT_IMAGES + protected tags):"
              echo "$TAGS_RESPONSE" | jq -r '.results[] | "  • \(.name) (updated: \(.last_updated))"' | head -10
              
              echo ""
              echo "🗑️  Tags to delete (keeping last $KEEP_RECENT_IMAGES for rollback):"
              echo "$TAGS_TO_DELETE" | while read -r tag; do
                echo "  • $tag"
              done
              
              echo ""
              echo "Deleting old tags..."
              DELETED_COUNT=0
              FAILED_COUNT=0
              
              echo "$TAGS_TO_DELETE" | while read -r tag; do
                if [ -n "$tag" ]; then
                  echo "Deleting tag: $tag"
                  DELETE_RESPONSE=$(curl -s -X DELETE -H "Authorization: JWT $AUTH_TOKEN" "https://hub.docker.com/v2/repositories/${{ env.IMAGE_NAME }}/tags/$tag/")
                  
                  if echo "$DELETE_RESPONSE" | jq -e '.detail' > /dev/null 2>&1; then
                    echo "  ❌ Failed to delete $tag: $(echo "$DELETE_RESPONSE" | jq -r '.detail')"
                    FAILED_COUNT=$((FAILED_COUNT + 1))
                  else
                    echo "  ✅ Successfully deleted $tag"
                    DELETED_COUNT=$((DELETED_COUNT + 1))
                  fi
                fi
              done
              
              echo ""
              echo "✅ Cleanup completed:"
              echo "  • Kept last $KEEP_RECENT_IMAGES images for rollback"
              echo "  • Protected tags: $PROTECTED_TAGS"
              echo "  • Total tags remaining: $((TOTAL_TAGS - $(echo "$TAGS_TO_DELETE" | wc -l)))"
            else
              echo "ℹ️  No old tags found to clean up (keeping all for rollback)"
              echo "  • Total tags: $TOTAL_TAGS"
              echo "  • All tags are recent or protected"
            fi
          else
            echo "❌ Failed to fetch tags from Docker Hub"
            echo "Response: $TAGS_RESPONSE"
            exit 1
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=develop,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GOOGLE_CREDENTIALS_BASE64=${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare deployment payload
        if: success()
        id: prepare-payload
        run: |
          # Convert tags to a single line JSON array
          TAGS_JSON=$(echo "${{ steps.meta.outputs.tags }}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          
          # Create the payload
          cat > payload.json << EOF
          {
            "image_name": "${{ env.IMAGE_NAME }}",
            "tags": $TAGS_JSON,
            "branch": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "actor": "${{ github.actor }}"
          }
          EOF
          
          echo "payload=$(cat payload.json)" >> $GITHUB_OUTPUT

      - name: Trigger Staging Deployment
        if: success()
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: build-success
          client-payload: ${{ steps.prepare-payload.outputs.payload }}

      - name: Notify Slack - Build Success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#deployments'
          text: |
            🐳 **Docker Image Built Successfully**
            Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            Tags: ${{ steps.meta.outputs.tags }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            ✨ Old images cleaned up, kept last 2 + latest + develop for rollback
            🚀 Triggering staging deployment...
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Notify Slack - Build Failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#deployments'
          text: |
            ❌ **Docker Image Build Failed**
            Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Check the logs for details.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
