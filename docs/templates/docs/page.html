{% extends "layouts/base.html" %}
{% load static %}

{% block title %}{{ doc_title }}{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{% static 'docs/css/common.css' %}" type="text/css">
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="page-title-box">
                <h4 class="page-title docs-page-title">{{ doc_section_title }}</h4>
            </div>
        </div>
    </div>

    <div class="docs-shell">
        <aside class="docs-sidebar">
            <div class="card-body">
                <div class="list-group list-group-flush">
                    {% for page in docs_pages %}
                        <a
                            class="list-group-item list-group-item-action px-0 {% if active_doc.0 == page.section_slug and active_doc.1 == page.page_slug %}active{% endif %}"
                            href="{% url page.url_name page.section_slug page.page_slug %}"
                        >
                            {{ page.title }}
                        </a>
                    {% endfor %}
                </div>
            </div>
        </aside>

        <section class="docs-content">
            <div class="card-body docs-article">
                {{ doc_html }}
            </div>
        </section>
    </div>
</div>
{% endblock %}
