version: 2.1
orbs:
  codecov: codecov/codecov@1.1.3
  heroku: circleci/heroku@0.0.10

default: &defaults
  docker:
    - image: "circleci/python:3.9"
      environment:
        DB_ENGINE: django.db.backends.postgresql_psycopg2
        DB_NAME: example
        DB_USERNAME: example
        DB_PASSWORD: example
        DB_HOST: localhost
        DB_PORT: 5432
    - image: "circleci/postgres:9.6.5-alpine-ram"
      environment:
        POSTGRES_USER: example
        POSTGRES_PASSWORD: example
        POSTGRES_DB: example
        
  working_directory: ~/project

cmd_attach_workspace: &cmd_attach_workspace
  attach_workspace:
    at: ~/project

cmd_install_packages: &cmd_install_packages
  run:
    command: |
      python3 -m venv venv
      . venv/bin/activate
      pip install -r requirements.txt

cmd_save_cache: &cmd_save_cache
  save_cache:
    key: api-dependencies-{{ checksum "Pipfile.lock" }}
    paths:
      - $(python3 -m venv venv)

cmd_restore_cache: &cmd_restore_cache
  restore_cache:
    key: deps1-{{ .Branch }}-{{ checksum "requirements.txt" }}

cmd_add_google_creds: &cmd_add_google_creds
  run:
    command: |
      echo $GOOGLE_CRED | base64 --decode > google_cred.json
      pwd
      ls

jobs: 
  build:
    docker:
      - image: cimg/python:3.9.1
    steps:
      - checkout
      - *cmd_add_google_creds
      - *cmd_attach_workspace
      - *cmd_install_packages
      # - *cmd_save_cache
  test:
    <<: *defaults
    steps:
      - checkout
      - *cmd_attach_workspace
      - *cmd_install_packages
      # - *cmd_restore_cache
      - run: 
          name: Running and generating report
          command: |
            . venv/bin/activate
            printenv
            coverage run manage.py test
            coverage report
            coverage xml

      - run:
          name: Upload coverage report to codeclimate
          command: |
            curl -L https://codeclimate.com/downloads/test-reporter/test-reporter-latest-linux-amd64 > ./cc-test-reporter
            chmod +x ./cc-test-reporter
            ./cc-test-reporter format-coverage -t coverage.py
            ./cc-test-reporter upload-coverage
  deploy:
    docker:
      - image: cimg/python:3.9.1
    steps:
      - checkout
      - heroku/deploy-via-git


workflows:
  version: 2
  build-and-test:
    jobs:
      - build
      - test:
          requires:
            - build
      - deploy:
          requires:
            - test
          filters:
            branches:
              only: develop
