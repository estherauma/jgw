{% extends 'layouts/base.html' %}
{% load crispy_forms_filters %}
<!-- title -->
{% block title %} Edit User {% endblock title %}

{% block page_title %} User Invitations {% endblock page_title %}

<!-- page content -->
{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    {{  form | crispy  }}
                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
