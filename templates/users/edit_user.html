{% extends 'layouts/base.html' %}
{% load crispy_forms_filters %}
<!-- title -->
{% block title %} Edit User {% endblock title %}

{% block page_title %} User Invitations {% endblock page_title %}

<!-- page content -->
{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <!-- Add hidden fields for return parameters -->
                    <input type="hidden" name="return_page" value="{{ return_page }}">
                    <input type="hidden" name="search" value="{{ search_query }}">
                    <input type="hidden" name="group" value="{{ group_id }}">
                    <input type="hidden" name="items_per_page" value="{{ items_per_page }}">
                    
                    {{  form | crispy  }}
                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <a href="{% url 'users:list_users' %}?page={{ return_page }}&search={{ search_query }}&group={{ group_id }}&items_per_page={{ items_per_page }}" 
                           class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
