{% extends "layouts/auth_base.html" %}

<!-- title -->
{% block title %}Handle Invite{% endblock title %}

<!-- page content -->
{% block content %}
<div class="row justify-content-center align-items-center mt-5">
    <!-- messages -->
    {% if messages %} {% for message in messages %}

    <p class="text-center alert alert-{{ message.tags }} mt-2" role="alert">
        {{ message }}
    </p>
    {% endfor %} {% endif %}
</div>
{% endblock content %}
