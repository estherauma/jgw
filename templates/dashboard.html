{% extends "layouts/base.html" %}

<!-- title -->
{% block title %} Preferences {% endblock title %}

<!-- page content -->
{% block content %}
<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-header d-flex align-items-center">
        <h3 class="mr-auto p-3">User Preferences Data</h3>
        <div class="btn-group">
          <button
            type="button"
            class="btn btn-primary mx-4"
            data-toggle="modal"
            data-target="#filterModal"
          >
            Filter
          </button>
          <a class="btn btn-primary" href="/preferences/export" target="_blank">
            Export
          </a>
        </div>
      </div>
      <div class="modal fade" id="filterModal">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Filter Data</h5>
              <button
                type="button"
                class="close"
                data-dismiss="modal"
                aria-label="Close"
              >
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <form
                id="filterPrefs"
                class="d-flex flex-column align-items-center"
                method="POST"
              >
                {% csrf_token %}
                <div class="form-group d-flex flex-column align-items-center">
                  <label class="form-label" for="destination">
                    {{form.destination.label}}
                  </label>
                  {{form.destination}} {{form.destination.errors}}
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button class="btn btn-secondary" data-dismiss="modal">
                Close
              </button>
              <button form="filterPrefs" type="submit" class="btn btn-primary">
                Submit
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-12">
    <div class="card">
      <canvas id="_age"> </canvas>
    </div>
  </div>
</div>
<div class="row">
  <div class="col-12">
    <div class="card">
      <canvas id="_gender"> </canvas>
    </div>
  </div>
</div>
{% endblock %}

<!-- ChartJS script  -->
{% block scripts %}
<script>
  {% for key, values in data.items %}
    new Chart(document.getElementById("_" + "{{key}}").getContext("2d"), {
        type: "bar",
        data: {
            labels: {{ values.labels|safe }},
            datasets: [
                {
                    label: "{{ key }}".toUpperCase(),
                    data: {{ values.data }},
                    backgroundColor: [
                        "rgba(255, 99, 132, 0.2)",
                        "rgba(54, 162, 235, 0.2)",
                        "rgba(255, 206, 86, 0.2)",
                        "rgba(75, 192, 192, 0.2)",
                        "rgba(153, 102, 255, 0.2)",
                        "rgba(255, 159, 64, 0.2)",
                    ],
                    borderColor: [
                        "rgba(255, 99, 132, 1)",
                        "rgba(54, 162, 235, 1)",
                        "rgba(255, 206, 86, 1)",
                        "rgba(75, 192, 192, 1)",
                        "rgba(153, 102, 255, 1)",
                        "rgba(255, 159, 64, 1)",
                    ],
                    borderWidth: 1,
                },
            ],
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                },
            },
        },
    });
  {% endfor %}
</script>
{% endblock %}
