{% load static %}
<!DOCTYPE html>

    <head>

        <meta charset="utf-8" />
        <title>UBold - Responsive Admin Dashboard Template</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta content="A fully featured admin theme which can be used to build CRM, CMS, etc." name="description" />
        <meta content="Coderthemes" name="author" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <!-- App favicon -->
        <link rel="shortcut icon" href="{% static 'themes/modern/images/favicon.ico' %}">

        <!-- plugin css -->
        <link href="{% static 'themes/modern/libs/admin-resources/jquery.vectormap/jquery-jvectormap-1.2.2.css' %}" rel="stylesheet" type="text/css" />

        <!-- Bootstrap css -->
        <link rel="stylesheet" href="{% static 'themes/modern/css/bootstrap.min.css' %}" type="text/css">
        <!-- App css -->
        <link rel="stylesheet" href="{% static 'themes/modern/css/app.min.css' %}" type="text/css" id="app-style">
        <!-- icons -->
        <link rel="stylesheet" href="{% static 'themes/modern/css/icons.min.css' %}" type="text/css">
        <link rel="stylesheet" href="{% static 'themes/modern/css/custom.css' %}" type="text/css" id="app-style">
        <!-- Head js -->
        <script src="{% static 'themes/modern/js/head.js' %}"></script>


    </head>

    <body  data-layout-mode="detached" data-theme="light" data-topbar-color="dark" data-menu-position="fixed" data-leftbar-color="light" data-leftbar-size='default' data-sidebar-user='true'>

        <!-- Begin page -->
        <div id="wrapper">

            <!-- Topbar Start -->
            {% include 'demo_dashboard/partials/topbar.html' %}
            <!-- end Topbar -->

            <!-- Left Sidebar Start -->
            {% include 'demo_dashboard/partials/sidebar.html' %}
            <!-- Left Sidebar End -->


            <!-- Start Page Content here -->
            {% block content%}{% endblock content %}
            <!-- End Page content -->


        </div>
        <!-- END wrapper -->

        <!-- Vendor js -->
        <script src="{% static 'themes/modern/js/vendor.min.js' %}"></script>

        <!-- Plugins js-->
        <script src="{% static 'themes/modern/libs/jquery-sparkline/jquery.sparkline.min.js' %}"></script>
        <script src="{% static 'themes/modern/libs/admin-resources/jquery.vectormap/jquery-jvectormap-1.2.2.min.js' %}"></script>
        <script src="{% static 'themes/modern/libs/admin-resources/jquery.vectormap/maps/jquery-jvectormap-world-mill-en.js' %}"></script>

        <!-- Dashboard 2 init -->
        <script src="{% static 'themes/modern/js/pages/dashboard-2.init.js' %}"></script>

        <!-- App js-->
        <script src="{% static 'themes/modern/js/app.min.js' %}"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
        {% block scripts %}{% endblock scripts %}
    </body>
</html>
