{% load static %}
<!DOCTYPE html>

    <head>

        <meta charset="utf-8" />
        <title>{% block title %} {% endblock %} | JGW Data Dashboards</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta content="A fully featured admin theme which can be used to build CRM, CMS, etc." name="description" />
        <meta content="Coderthemes" name="author" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <!-- App favicon -->
        <link rel="shortcut icon" href="{% static 'themes/modern/images/favicon.ico' %}">

        <!-- plugin css -->
        <link href="{% static 'themes/modern/libs/admin-resources/jquery.vectormap/jquery-jvectormap-1.2.2.css' %}" rel="stylesheet" type="text/css" />

        <!-- Bootstrap css -->
        <link rel="stylesheet" href="{% static 'themes/modern/css/bootstrap.min.css' %}" type="text/css">
        <!-- App css -->
        <link rel="stylesheet" href="{% static 'themes/modern/css/app.min.css' %}" type="text/css" id="app-style">
        <!-- icons -->
        <link rel="stylesheet" href="{% static 'themes/modern/css/icons.min.css' %}" type="text/css">
        <link rel="stylesheet" href="{% static 'themes/modern/css/custom.css' %}" type="text/css" id="app-style">
        <!-- Head js -->
        <script src="{% static 'themes/modern/js/head.js' %}"></script>

        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" integrity="sha256-kLaT2GOSpHechhsozzB+flnD+zUyjE2LlfWPgU04xyI=" crossorigin="" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-extra-markers/1.2.1/css/leaflet.extra-markers.min.css" integrity="sha512-wurszDyO1nj6ESdfrXb9h1hmoHMu3sQ3iXgKcu/p81lT+KaPGkta9NIPX7k6XXGgVYpcRHcc8AA4UIeQ7Ax/Cw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link type="text/css" rel="stylesheet" href="https://api.mqcdn.com/sdk/mapquest-js/v1.3.2/mapquest.css"/>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select-country@4.2.0/dist/css/bootstrap-select-country.min.css">
        <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/font-awesome/4.5.0/css/font-awesome.min.css">
        <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/highlight.js/9.12.0/styles/xcode.min.css" />

        <!-- custom styles -->
        <link rel="stylesheet" href="{% static 'map/styles.css'%}"></link>
        <link rel="stylesheet" href="{% static 'css/dashboard.css' %} " />
        <link rel="stylesheet" href="{% static 'dashboard/css/bootstrap-multiselect.css' %} " />
        <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />
        
        <style>
            {% block styles %}{% endblock %}
        </style>
    </head>

    <body  data-layout-mode="detached" data-theme="light" data-topbar-color="dark" data-menu-position="fixed" data-leftbar-color="light" data-leftbar-size='default' data-sidebar-user='true'>

        <!-- Begin page -->
        <div id="wrapper">

            <!-- show side bar only for logged-in users -->
           
            <!-- Topbar Start -->
            {% include 'includes/topbar.html' %}
            <!-- end Topbar -->
            <!-- Left Sidebar Start -->
            {% include 'includes/sidebar.html' %}
            <!-- Left Sidebar End -->


            <!-- Start Page Content here -->
            <div class="content-page" style="margin-top: 100px;">
                <div class="content">
                    {% include 'includes/messages.html' %}
                    {% block content%}{% endblock content %}
                </div>
            </div>
            <!-- End Page content -->


        </div>
        <!-- END wrapper -->

        <!-- custom js files -->
        <script src="{% static 'dashboard/js/utils.js' %}"></script>
        <script src="{% static 'dashboard/js/const.js' %}"></script>
        <script src='/static/themes/colorlib/js/jquery.min.js'></script>
        <script src='/static/themes/colorlib/js/popper.js'></script>
        <script src='/static/themes/colorlib/js/bootstrap.min.js'></script>
        <!-- Vendor js -->
        <script src="{% static 'themes/modern/js/vendor.min.js' %}"></script>

        <!-- Plugins js-->
        <script src="{% static 'themes/modern/libs/jquery-sparkline/jquery.sparkline.min.js' %}"></script>
        <script src="{% static 'themes/modern/libs/admin-resources/jquery.vectormap/jquery-jvectormap-1.2.2.min.js' %}"></script>
        <script src="{% static 'themes/modern/libs/admin-resources/jquery.vectormap/maps/jquery-jvectormap-world-mill-en.js' %}"></script>

        <!-- Dashboard 2 init -->
        <script src="{% static 'themes/modern/js/pages/dashboard-2.init.js' %}"></script>

        <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js" integrity="sha256-WBkoXOwTeyKclOHuWtc+i2uENFpDZ9YPdf5Hf+D7ewM=" crossorigin=""></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-extra-markers/1.2.1/js/leaflet.extra-markers.js" integrity="sha512-Jgp0ME6T7Hwe5HT+dHl8CFpKhtNbjgwyzLKq4/OGR2s8cfR3bORtDTTePvI8MO3jtOI47VTQOAL9VjF0sVNBhA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/perliedman-leaflet-control-geocoder/2.4.0/Control.Geocoder.min.js" integrity="sha512-Pwbi+LtFQRtPHuYkIIwns8XTgCPEV2Eqp4Sk/JovY+pbG6buhvnOfqKLXzo08GvodwJbBu+y3omGBAj4F4Xyig==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <script src="https://cdn.jsdelivr.net/npm/react-leaflet-arrowheads@1.1.0/build/react-leaflet-arrowheads.min.js"></script>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap-select-country@4.2.0/dist/js/bootstrap-select-country.min.js"></script>
        <script src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/9.12.0/highlight.min.js"></script>
        <script>hljs.initHighlightingOnLoad();</script>

        <script type="text/javascript" src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js"></script>
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>

        <!-- App js-->
        <script src="{% static 'themes/modern/js/app.min.js' %}"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

        <script src="{% static 'dashboard/js/bootstrap-multiselect.js' %} "></script>

        <script src="{% static 'dashboard/js/index.js' %}"></script>
        {% block scripts %}{% endblock scripts %}
        <script>

            var start = moment().subtract(29, 'days');
            var end = moment();
            
            $('#time_range').daterangepicker({
                startDate: start,
                endDate: end,
                ranges: {
                   'Today': [moment(), moment()],
                   'Yesterday': [moment().subtract(1, 'days'), moment().subtract(1, 'days')],
                   'Last 7 Days': [moment().subtract(6, 'days'), moment()],
                   'Last 30 Days': [moment().subtract(29, 'days'), moment()],
                   'Last 60 Days': [moment().subtract(59, 'days'), moment()],
                   'Last 90 Days': [moment().subtract(89, 'days'), moment()],
                   'This Month': [moment().startOf('month'), moment().endOf('month')],
                   'Last Month': [moment().subtract(1, 'month').startOf('month'), moment().subtract(1, 'month').endOf('month')]
                }
            });
        </script>
    </body>
</html>
