{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Just Good Work</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta content="A fully featured admin theme which can be used to build CRM, CMS, etc." name="description" />
        <meta content="Coderthemes" name="author" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />

        <!-- App favicon -->
        <link rel="shortcut icon" href="{% static 'themes/modern/images/favicon.ico' %}">

        <!-- Bootstrap core CSS -->
        <link rel="stylesheet" href="{% static 'themes/landing/css/bootstrap.min.css' %}" type="text/css">

        <!--Material Icon -->
        <link rel="stylesheet" type="text/css" href="{% static 'themes/landing/css/materialdesignicons.min.css' %}" />

        <!-- Custom  sCss -->
        <link rel="stylesheet" type="text/css" href="{% static 'themes/landing/css/style.css' %}" />

    </head>
    <body data-bs-spy="scroll" data-bs-target=".navbar" data-bs-offset="78">
        <!--Navbar Start-->
        <nav class="navbar navbar-expand-lg fixed-top navbar-custom sticky-dark" id="sticky">
            <div class="container-fluid">
                <!-- LOGO -->
                <a class="logo text-uppercase" href="{% url 'dashboard:landing' %}">
                    <img src="/static/logo.png" class="logo-light" alt="" height="70" width="240"> 
                    <img src="{% static 'logo-sm-colored-2.png' %}" alt="" class="logo-dark" height="21" />
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                    <i class="mdi mdi-menu"></i>
                </button>
                <div class="collapse navbar-collapse" id="navbarCollapse">
                    <ul class="navbar-nav mx-auto navbar-center" id="mySidenav">
                        <li class="nav-item">
                            <a href="#home" class="nav-link">Home</a>
                        </li>
                        <li class="nav-item">
                            <a href="#pricing" class="nav-link">Pricing</a>
                        </li>
                        <li class="nav-item">
                            <a href="#faq" class="nav-link">Faqs</a>
                        </li>
                        <li class="nav-item">
                            <a href="#partners" class="nav-link">Partners</a>
                        </li>
                        <li class="nav-item">
                            <a href="#contact" class="nav-link">Contact</a>
                        </li>
                    </ul>
                    <div>
                        <a href="{% url 'users:login_user' %}" class="btn btn-info navbar-btn">Login</a>
                        <a href="{% url 'dashboard:limited_data_home_page' %}" class="btn btn-info navbar-btn">Try Now</a>
                    </div>
                </div>
            </div>
        </nav>
        <!-- Navbar End -->
        {% block body %}
        {% endblock body %}
            <!-- footer start -->
            <footer class="bg-dark footer">
                <div class="container-fluid">
                    <!-- end row -->
    
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="float-start pull-none">
                                <p class="text-white-50"><script>document.write(new Date().getFullYear())</script> &copy; Just Good Work. A product <a href="https://50eight.com" target="_blank" class="text-white-50">50Eight</a> </p>
                            </div>
                            <div class="float-end pull-none">
                                <ul class="list-inline social-links">
                                    <li class="list-inline-item text-white-50">
                                        Social :
                                    </li>
                                    <li class="list-inline-item"><a href="#"><i class="mdi mdi-facebook"></i></a></li>
                                    <li class="list-inline-item"><a href="https://twitter.com/JustGoodWork" target="_blank"><i class="mdi mdi-twitter"></i></a></li>
                                    <li class="list-inline-item"><a href="#"><i class="mdi mdi-instagram"></i></a></li>
                                    <li class="list-inline-item"><a href="#"><i class="mdi mdi-google-plus"></i></a></li>
                                </ul>
                            </div>
                        </div>
                        <!-- end col -->
                    </div>
                    <!-- end row -->
                </div>
                <!-- container-fluid -->
            </footer>
            <!-- footer end -->
    
            <a href="#" onclick="topFunction()" class="back-to-top-btn btn btn-primary" id="back-to-top-btn"><i class="mdi mdi-chevron-up"></i></a>
    
            <!-- javascript -->
            
            <script src="{% static 'themes/modern/libs/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
        
            <!-- custom js -->
            <script src="{% static 'themes/landing/js/app.js' %}"></script>
            <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
            {% block scripts %}{% endblock scripts %}
    </body>
</html>
